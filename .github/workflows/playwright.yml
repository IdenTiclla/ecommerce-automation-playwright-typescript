name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all Playwright tests
        run: npm test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Add Allure summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const resultsPath = "allure-results";
            if (!fs.existsSync(resultsPath)) {
              process.exit(0);
            }
            const stats = { total: 0, passed: 0, failed: 0, broken: 0, skipped: 0, unknown: 0 };
            for (const file of fs.readdirSync(resultsPath).filter((file) => file.endsWith("-result.json"))) {
              const result = JSON.parse(fs.readFileSync(`${resultsPath}/${file}`, "utf8"));
              stats.total += 1;
              stats[result.status] = (stats[result.status] || 0) + 1;
            }
            const count = (name) => stats[name];
            const lines = [
              "## Allure report",
              "",
              "| Total | Passed | Failed | Broken | Skipped | Unknown |",
              "| ---: | ---: | ---: | ---: | ---: | ---: |",
              `| ${count("total")} | ${count("passed")} | ${count("failed")} | ${count("broken")} | ${count("skipped")} | ${count("unknown")} |`,
              "",
              "Download the `allure-report` artifact for the interactive report and charts.",
              ""
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\\n"));
          '

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Playwright Tests
          path: test-results/results.xml
          reporter: java-junit

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Upload current Allure report to GitHub Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  deploy-pages:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
